# Generated by the development repository's publishing tooling from the
# project's declared checks, which also gate every publish. Edit the checks
# there; a change made only here is overwritten by the next publish.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-typecheck-test-and-build:
    name: lint, typecheck, test and build
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: lint, typecheck, test and build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
